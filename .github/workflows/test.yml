name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install from this checkout
        run: |
          brew tap-new --no-git local/test
          cp Formula/pulse.rb "$(brew --repository)/Library/Taps/local/homebrew-test/Formula/"
          brew install local/test/pulse
      - name: Check the binary
        run: |
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/pulse.rb)
          pulse --version
          pulse --version | grep -F "$version"
